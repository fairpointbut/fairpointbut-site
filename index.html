<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fair Point, But…</title>
  <meta
    name="description"
    content="Fair Point, But is an independent software company."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f3ee;
      color: #1c2633;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 64px 40px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dedbd4;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(28, 38, 51, 0.08);
    }

    .label {
      margin-bottom: 20px;
      color: #58705a;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 20px;
      font-family: Georgia, serif;
      font-size: clamp(42px, 8vw, 68px);
      line-height: 1;
    }

    p {
      max-width: 560px;
      margin: 0 auto 30px;
      color: #53606d;
      font-size: 19px;
      line-height: 1.6;
    }

    a {
      color: #1c2633;
      font-weight: bold;
    }

    footer {
      margin-top: 42px;
      color: #7a838c;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <div class="label">Website in development</div>

    <h1>Fair Point, But…</h1>

    <p>
      We are an independent software company currently developing
      our first product.
    </p>

    <a href="mailto:hello@fairpointbut.com">
      hello@fairpointbut.com
    </a>

    <footer>
      &copy; 2026 Fair Point, But. All rights reserved.
    </footer>
  </main>
</body>
</html>
